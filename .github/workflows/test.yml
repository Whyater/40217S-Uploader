name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse-check both scripts
        run: |
          $bad = 0
          foreach ($f in 'install.ps1', 'ScourgeUploader.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$tokens, [ref]$errors)
            Write-Host ($f + ': ' + $errors.Count + ' parse errors')
            foreach ($e in $errors) {
              Write-Host ('  line ' + $e.Extent.StartLineNumber + ': ' + $e.Message)
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          exit 0

      - name: Check uploader manifest
        run: |
          $manifest = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'uploader.json') | ConvertFrom-Json
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'ScourgeUploader.ps1'
          $scriptText = (Get-Content -Raw $scriptPath).Replace("`r`n", "`n")
          $m = [regex]::Match($scriptText, '\$script:UploaderVersion\s*=\s*''([^'']+)''')
          if (-not $m.Success) { Write-Error 'UploaderVersion constant was not found'; exit 1 }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($scriptText)
            $actualHash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ([string]$manifest.version -ne $m.Groups[1].Value) { Write-Error ('uploader.json version does not match script: ' + $manifest.version + ' vs ' + $m.Groups[1].Value); exit 1 }
          if ([string]$manifest.sha256 -ne $actualHash) { Write-Error ('uploader.json SHA-256 does not match script: expected ' + $manifest.sha256 + ' got ' + $actualHash); exit 1 }
          Write-Host ('Uploader manifest OK: ' + $manifest.version)

      - name: Set up environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Set-GhEnv([string]$Name, [string]$Value) {
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, ($Name + '=' + $Value + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          }
          Set-GhEnv 'SCOURGE_NO_SHORTCUTS' '1'
          Set-GhEnv 'SCOURGE_INSTALL_SOURCE' $env:GITHUB_WORKSPACE
          Set-GhEnv 'SCOURGE_INSTALL_DIR' (Join-Path $env:RUNNER_TEMP 'ScourgeUploader')
          Set-GhEnv 'SCOURGE_SCREENSHOT' (Join-Path $env:RUNNER_TEMP 'uploader-window.png')

          # Is there a release to download? Use the workflow token to avoid API rate limits.
          $status = 0
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/latest' -Headers @{
              'Authorization' = ('Bearer ' + $env:GH_TOKEN)
              'Accept'        = 'application/vnd.github+json'
            }
            $status = [int]$r.StatusCode
          } catch {
            if ($null -ne $_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Host ('Release lookup failed: ' + $_.Exception.Message)
          }
          Write-Host ('Latest release lookup: HTTP ' + $status)
          if ($status -eq 200) {
            Set-GhEnv 'SCOURGE_SELFTEST_DOWNLOAD' '1'
            Write-Host 'A release exists, so the self-test will download it.'
          } else {
            Write-Host 'No release available, so the self-test skips the download.'
          }

      - name: Install from this checkout
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & { Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'install.ps1') | Invoke-Expression } *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Scourge Uploader installed to') {
            Write-Host '::error::Installer did not report success'
            exit 1
          }
          $pros = Get-ChildItem -Path (Join-Path $env:SCOURGE_INSTALL_DIR 'pros-cli') -Filter 'pros.exe' -Recurse -File | Select-Object -First 1
          if (-not $pros) {
            Write-Host '::error::pros.exe not found after install'
            exit 1
          }
          $v = (& $pros.FullName --version 2>&1 | Out-String)
          Write-Host $v
          if (($LASTEXITCODE -ne 0) -or ($v -notmatch 'version')) {
            Write-Host '::error::pros --version failed'
            exit 1
          }
          exit 0

      - name: Run the app self-test
        run: |
          $ErrorActionPreference = 'Continue'
          $script = Join-Path $env:SCOURGE_INSTALL_DIR 'ScourgeUploader.ps1'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -SelfTest -InstallDir $env:SCOURGE_INSTALL_DIR 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host '----- self-test log -----'
          Write-Host $out
          Write-Host ('----- exit code ' + $code + ' -----')
          if ($code -ne 0) {
            Write-Host '::error::Self-test exited non-zero'
            exit 1
          }
          if (($env:SCOURGE_SELFTEST_DOWNLOAD -eq '1') -and ($out -notmatch 'Download: OK')) {
            Write-Host '::error::Self-test output has no "Download: OK"'
            exit 1
          }
          exit 0

      - name: Upload window screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uploader-window
          path: ${{ runner.temp }}\uploader-window.png
          if-no-files-found: warn

  web-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the web uploader tests
        run: node --test web/test/
