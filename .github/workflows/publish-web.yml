name: Publish web uploader

# Puts the web uploader on GitHub Pages (gh-pages) with the latest release, so the web
# app never lags behind a build. Runs after every new release, after a change to web/
# on main, and by hand. scripts/publish-web.sh does the work and refuses to publish if
# the web tests or a release hash fail.
on:
  workflow_run:
    workflows: [Publish release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/publish-web.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-web.sh
