name: Deploy web uploader

# Publishes web/ plus the newest release's files to GitHub Pages.
# Browsers cannot fetch release assets directly (no CORS on the asset CDN), so
# Pages serves verified copies under /build/.
# The release workflow uses the default workflow token, and events created that
# way do not start other workflows, so a `release: published` trigger would
# never fire. workflow_run on "Publish release" is what actually works.
# Deliberate gate: Pages deploys from that trigger only when the whole
# "Publish release" run succeeded, so a failed release never reaches phones.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Publish release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the web tests
        run: node --test web/test/

      - name: Copy web/ into the site folder
        run: |
          set -euo pipefail
          if [ ! -d web ]; then echo "::error::web/ not found"; exit 1; fi
          mkdir -p _site
          cp -R web/. _site/
          rm -rf _site/test _site/package.json
          mkdir -p _site/build
          # New cache name per deploy so installed copies update.
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA}';/" _site/sw.js
          grep -q "const VERSION = '${GITHUB_SHA}';" _site/sw.js

      - name: Download the latest release into build/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download --dir _site/build --pattern '*' --clobber
          ls -l _site/build

      - name: Verify every file against release.json
        run: |
          set -euo pipefail
          cd _site/build
          jq -e '.tag | type == "string" and length > 0' release.json > /dev/null
          count=0
          while IFS=$'\t' read -r name expected; do
            if [ ! -f "$name" ]; then echo "::error::$name is listed in release.json but was not downloaded"; exit 1; fi
            actual=$(sha256sum "$name" | awk '{print tolower($1)}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 mismatch for $name"
              exit 1
            fi
            count=$((count + 1))
          done < <(jq -r '.sha256 | to_entries[] | [.key, (.value | ascii_downcase)] | @tsv' release.json)
          if [ "$count" -eq 0 ]; then echo "::error::release.json lists no files"; exit 1; fi
          for f in hot.package.bin cold.package.bin project.pros; do
            [ -f "$f" ] || { echo "::error::$f missing from build/"; exit 1; }
          done
          echo "Verified $count files"

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
