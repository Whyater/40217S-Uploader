  border: 0; border-radius: 7px; background: transparent; color: var(--text); transition: background-color 0.15s ease-out;
}

<script>
/*<pure>*/
// Everything between the pure markers touches no DOM, so map_check.mjs can load and test it in Node.
// Units: inches and degrees. Field frame: origin at center, +Y up, +X right, heading 0 up, clockwise positive.

const LIMITS = { goodIn: 1, warnIn: 3, goodDeg: 2, warnDeg: 5 }; // in the miss colors; the degree limits are a display choice
const KIND_LABEL = { opening: 'Opening', turn: 'Turn', drive: 'Drive', grab_stack: 'Grab stack', grab_pin: 'Grab Pin', drop: 'Drop', toggle: 'Toggle', push: 'Push' };
const SESSION_LABEL = { teach_open: 'Teach after opening', teach_start: 'Teach from start', push: 'Push test', run: 'Run' };
const MARK_TO_KIND = { pin: 'grab_pin', stack: 'grab_stack', drop: 'drop', toggle: 'toggle', push: 'push' };
const NO_POS = new Set(['turn', 'toggle', 'opening', 'push']);
const NO_HEAD = new Set(['drive', 'toggle', 'opening', 'push']);
const MARK_KINDS = new Set(['grab_stack', 'grab_pin', 'drop', 'toggle']);

/* ---------- small helpers ---------- */
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const nn = (v) => (isNum(v) ? v : null);
const arr = (v) => (Array.isArray(v) ? v : []);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f3 = (n) => String(Math.round(n * 1000) / 1000);
function fmt(v, d) {
  if (!isNum(v)) return 'n/a';
  const s = v.toFixed(d == null ? 1 : d);
  return /^-0(\.0+)?$/.test(s) ? s.slice(1) : s;
}
const fmtS = (v) => (isNum(v) ? v.toFixed(2) + ' s' : 'n/a');

/* ---------- the miss math ---------- */
function wrap180(d) { return ((((d + 180) % 360) + 360) % 360) - 180; }
function headingMiss(actual, target) { return isNum(actual) && isNum(target) ? wrap180(actual - target) : null; }
function missIn(ev) {
  if (!ev || !isNum(ev.x) || !isNum(ev.y) || !isNum(ev.tx) || !isNum(ev.ty)) return null;
  return Math.hypot(ev.x - ev.tx, ev.y - ev.ty);
}
function rate(v, good, warn) {
  if (!isNum(v)) return null;
  const r = Math.round(v * 100) / 100; // rate what the table shows
  return r < good ? 'good' : r < warn ? 'warn' : 'bad';
}
const rateIn = (v) => rate(v, LIMITS.goodIn, LIMITS.warnIn);
const rateDeg = (v) => rate(isNum(v) ? Math.abs(v) : null, LIMITS.goodDeg, LIMITS.warnDeg);
const ORDER = { good: 0, warn: 1, bad: 2 };
const worse = (a, b) => (a == null ? b : b == null ? a : ORDER[b] > ORDER[a] ? b : a);

/* ---------- normalising whatever the tool hands over ---------- */
function normPt(o) {
  o = o && typeof o === 'object' ? o : {};

  }
  const capPts = caps.reduce((a, c) => a.concat(c.pts), []);
  const placed = [], goals = new Map();
  geo.forEach((o) => {
    let best = null;
    spots(o).forEach((c) => {
      const b = boxAt(o, c);
      let hard = 0;
      geo.forEach((q) => { if (q !== o && boxHitsDisc(b, q.disc)) hard++; });
      things.forEach((d) => { if (boxHitsDisc(b, d)) hard++; });
      capPts.forEach((q) => { if (boxHitsDisc(b, { x: q.x, y: q.y, r: 6 })) hard++; });
      placed.concat(axes).forEach((q) => { if (boxHitsBox(b, q)) hard++; });
      const onLine = b.x + b.y < 0 && b.x + b.w + b.y + b.h > 0 ? 1 : 0; // the line is x + y = 0 in px with y down
      const seen = b.x * k >= vb[0] && (b.x + b.w) * k <= vb[0] + vb[2] && b.y * k >= vb[1] && (b.y + b.h) * k <= vb[1] + vb[3];
      const onPred = segs.some((sg) => segHitsBox(sg[0], sg[1], b, 3)) || (!!segs.start && boxHitsBox(b, { x: segs.start.x - 2, y: segs.start.y - 2, w: segs.start.w + 4, h: segs.start.h + 4 }));
      const score = (hard + (onPred ? 1 : 0)) * 10 + (seen ? 0 : 3) + onLine;
      if (!best || score < best.score) best = { score, c, b, seen, onPred };
    });
    placed.push(best.b);
    // A name that would be cut by the edge of the view, or would sit on the predicted line wherever it goes, is not printed.
    goals.set(o.g, { dx: best.c.dx, dy: best.c.dy, anchor: best.c.a, box: best.b, seen: best.seen && !best.onPred });
  });
  ctx.labels = { goals, caps };
  return ctx.labels;
}
// Where a Goal's body and name sit, in px around the Goal.
function goalGeom(g, F, ctx) {
  const k = ctx.k, R = Math.max(F.goalRadius / k, 4), lab = fieldLabels(F, ctx).goals.get(g);
  return { R, label: lab, box: lab.box, disc: { x: g.x / k, y: -g.y / k, r: R + 6 } };
}

function renderFieldObjects(model, route, ctx) {
  const F = model.field, k = ctx.k, p = [];
  F.loaders.forEach((o) => {
    if (o.zone && o.zone.w !== null && o.zone.h !== null) {
      const w = o.zone.w, h = o.zone.h, left = o.x < 0;
      p.push('<rect class="zone ns" x="' + f3(left ? -F.wall : F.wall - w) + '" y="' + f3(-(-F.wall + h)) + '" width="' + f3(w) + '" height="' + f3(h) + '"><title>Load Zone near ' + esc(o.name || 'Loader') + '</title></rect>');
    }
    p.push(at(o.x, o.y, k, '<rect class="loader" x="-6" y="-6" width="12" height="12" rx="1.5" transform="rotate(45)"/><title>' + esc(o.name || 'Loader') + '</title>'));
  });
  F.toggles.forEach((o) => {
    const len = o.len !== null ? o.len : 25.8, th = 2.4, horiz = Math.abs(Math.abs(o.y) - F.wall) < Math.abs(Math.abs(o.x) - F.wall);
    const w = horiz ? len : th, h = horiz ? th : len, cls = 'toggle-bar' + (o.kind === 'other' ? ' other' : '');
    p.push('<rect class="' + cls + '" x="' + f3(o.x - w / 2) + '" y="' + f3(-o.y - h / 2) + '" width="' + f3(w) + '" height="' + f3(h) + '" rx="0.5"><title>' + esc(o.name || 'Toggle') + '</title></rect>');
  });
  F.objects.forEach((o) => {
    const R = Math.max((o.r !== null ? o.r : 1.6) / k, 3);
    let inner;
    if (o.kind === 'cup') inner = '<circle class="obj-ring" r="' + f3(R) + '"/>';
    else if (o.kind === 'stack') inner = '<circle class="obj-ring" r="' + f3(R) + '"/><circle class="obj" r="' + f3(R * 0.45) + '"/>';
    else if (o.kind === 'pin') inner = '<circle class="obj" r="' + f3(R * 0.8) + '"/>';
    else inner = '<path class="obj-ring" d="M' + f3(-R) + ' ' + f3(-R) + 'L' + f3(R) + ' ' + f3(R) + 'M' + f3(R) + ' ' + f3(-R) + 'L' + f3(-R) + ' ' + f3(R) + '"/>';
    p.push(at(o.x, o.y, k, inner + '<title>' + esc((o.name || 'Object') + (o.kind ? ' (' + o.kind + ')' : '')) + '</title>'));
  });
  F.goals.forEach((g) => {
    const gg = goalGeom(g, F, ctx), R = gg.R, kind = g.kind;
    let body;
    if (kind === 'alliance') body = '<circle class="goal-ally-ring" r="' + f3(R + 4) + '"/><circle class="goal-ally-body" r="' + f3(R) + '"/>';
    else if (kind === 'opponent') { const a = R * 0.62; body = '<circle class="goal-opp-ring" r="' + f3(R + 4) + '"/><circle class="goal-opp-body" r="' + f3(R) + '"/><path class="goal-opp-x" d="M' + f3(-a) + ' ' + f3(-a) + 'L' + f3(a) + ' ' + f3(a) + 'M' + f3(a) + ' ' + f3(-a) + 'L' + f3(-a) + ' ' + f3(a) + '"/>'; }
    else if (kind === 'center') body = '<circle class="goal-neu-ring" r="' + f3(R + 4) + '"/><circle class="goal-neu-body" r="' + f3(R) + '"/>';
    else body = '<circle class="goal-neu-body" r="' + f3(R) + '"/>';
    const pins = route && route.checks.pins[g.name] ? route.checks.pins[g.name] : 0;
    let badge = '';
    if (pins > 0) {
      const tx = String(pins), bw = 12 + tx.length * 7;
      badge = '<g class="pinbadge" transform="translate(' + f3(R + 6) + ' -7.5)"><rect width="' + f3(bw) + '" height="15" rx="3.5"/><g transform="translate(8 8)">' + sym('grab_pin', 3.4, 'sym') + '</g><text x="' + f3(bw - 5) + '" y="11.3" text-anchor="end">' + esc(tx) + '</text></g>';
    }
    const label = !gg.label.seen ? '' : '<text class="lbl strong halo" x="' + f3(gg.label.dx) + '" y="' + f3(gg.label.dy) + '" text-anchor="' + gg.label.anchor + '">' + esc(shortName(g.name || 'Goal')) + '</text>';
    const kindName = kind === 'alliance' ? 'our alliance Goal' : kind === 'opponent' ? 'opponent alliance Goal' : kind === 'center' ? 'tall neutral Goal' : 'neutral Goal';
    p.push(at(g.x, g.y, k, body + label + badge + '<title>' + esc((g.name || 'Goal') + ', ' + kindName + ', at ' + fmt(g.x) + ', ' + fmt(g.y) + (pins ? ', ' + pins + ' Pin' + (pins === 1 ? '' : 's') + ' from this route' : '')) + '</title>'));
  });
  return p.join('');
}

function renderRoute(model, state, sel, ctx) {
  const route = sel.route, k = ctx.k, F = model.field, L = F.robot.length, W = F.robot.width, p = [];
  if (!route) return '';
  const hitSteps = new Set(sel.contactList.map((c) => c.step));
  if (state.layers.sweep) sweepPolygons(route, L, W).forEach((s) => p.push('<polygon class="sweep ns' + (hitSteps.has(s.step) ? ' hit' : '') + '" points="' + polyPts(s.poly) + '"/>'));
  // Footprints are off by default. A footprint that touches something is drawn anyway, in red, so a hit is never hidden.
  route.wp.forEach((w, i) => {
    const hit = hitSteps.has(i);
    if (!w || w.x === null || !(state.layers.foot || hit)) return;
    const c = footprintCorners(w.x, w.y, w.h, L, W), hc = hit ? ' hit' : '';
    p.push('<polygon class="fp ns' + hc + '" points="' + polyPts(c) + '"/><line class="fp-front ns' + hc + '" x1="' + f3(c[0].x) + '" y1="' + f3(-c[0].y) + '" x2="' + f3(c[1].x) + '" y2="' + f3(-c[1].y) + '"/>');
  });
  const start = route.start.kind === 'pose' ? startPoseOf(route) : null;
  const extra = [];
  if (start) { extra.push({ x: start.x / k, y: -start.y / k }); extra.push({ x: start.x / k + 8, y: -start.y / k - 19, w: 40, h: 14 }); } // the START word
  if (route.opening) {
    extra.push({ x: route.opening.x / k, y: -route.opening.y / k });
    const ol = openingLabel(route.opening, F, ctx);
    if (ol) extra.push(ol.box);
  }
  if (state.layers.route) {
    route.wp.forEach((w, i) => {
      if (!w || w.x === null || !w.moved || !w.from) return;
      const back = route.steps[i].kind === 'drive' && route.steps[i].forwards === false;
      p.push('<line class="route-leg ns' + (back ? ' back' : '') + '" x1="' + f3(w.from.x) + '" y1="' + f3(-w.from.y) + '" x2="' + f3(w.x) + '" y2="' + f3(-w.y) + '"/>');
      const mx = (w.from.x + w.x) / 2, my = (w.from.y + w.y) / 2, ang = (Math.atan2(-(w.y - w.from.y), w.x - w.from.x) * 180) / Math.PI;
      if (Math.hypot(w.x - w.from.x, w.y - w.from.y) * (1 / k) > 36) p.push(at(mx, my, k, '<path class="chev" d="M5 0L-4 4.5L-4 -4.5Z" transform="rotate(' + f3(ang) + ')"/>'));
    });
    if (start) {
      if (state.layers.foot) p.push('<polygon class="fp ns" points="' + polyPts(footprintCorners(start.x, start.y, start.h, L, W)) + '" style="stroke-dasharray:3 2"/>');
      p.push(at(start.x, start.y, k, '<circle class="dot" r="4.5"/><text class="lbl strong halo" x="8" y="-7">START</text>'));
    }
    const op = route.opening;
    if (op) {
      const exact = op.source === 'teach';
      p.push(at(op.x, op.y, k, '<circle class="open-ring' + (exact ? '' : ' approx') + '" r="' + (exact ? 6.5 : 11) + '"/>' + (exact ? '<path class="open-cross" d="M-3.5 0h7M0 -3.5v7"/>' : '') +
        (() => { const l = openingLabel(op, F, ctx); return l ? '<text class="lbl strong halo" x="' + l.dx + '" y="' + l.dy + '" text-anchor="' + (l.dx < 0 ? 'end' : 'start') + '">' + l.text + '</text>' : ''; })() +
        '<title>' + (exact ? 'Where the opening ended: first sample of the teach session. Step 0 starts here.' : 'No teach_open session selected, so this is the first waypoint the route has, not a measured end of the opening.') + '</title>'));
    }
  }
  // Symbols first, then number tags on top, so a tag is never hidden by a neighbour's symbol.
  model.field.goals.forEach((g) => { const gg = goalGeom(g, F, ctx); extra.push(gg.disc, gg.box); });
  const wm = state.layers.run ? worstMark(model, sel, ctx) : null;
  if (wm) extra.push(wm.box);
  const labels = route.wp.map((w, i) => i);
  const px = route.wp.map((w) => (w && w.x !== null ? { x: w.x / k, y: -w.y / k } : null));
  const lay = state.layers.tags ? layoutTags(px, labels, extra) : [];
  route.wp.forEach((w, i) => {
    if (!w || w.x === null) return;
    const kind = route.steps[i].kind, isMark = MARK_KINDS.has(kind);
    let inner = '<circle class="hit-target" r="12"/>';
    if (state.layers.route) inner += isMark ? sym(kind, 6.5, 'sym') : '<circle class="dot" r="3.2"/>';
    p.push(at(w.x, w.y, k, inner + '<title>Step ' + i + ': ' + esc(KIND_LABEL[kind] || kind) + '</title>', ' data-step="' + i + '" class="stepmark"'));
  });
  route.wp.forEach((w, i) => {
    const L2 = lay[i];
    if (!w || w.x === null || !L2) return;
    let inner = '';
    if (L2.leader) {
      const d = Math.hypot(L2.dx, L2.dy) || 1, ux = L2.dx / d, uy = L2.dy / d;
      inner += '<line class="leader" x1="' + f3(ux * 8) + '" y1="' + f3(uy * 8) + '" x2="' + f3(L2.dx - ux * 9) + '" y2="' + f3(L2.dy - uy * 9) + '"/>';
    }
    inner += '<g transform="translate(' + f3(L2.dx) + ' ' + f3(L2.dy) + ')">' + tagSvg(i, i, state.step === i) + '</g>';
    p.push(at(w.x, w.y, k, inner + '<title>Step ' + i + ': ' + esc(KIND_LABEL[route.steps[i].kind] || route.steps[i].kind) + '</title>', ' data-step="' + i + '" class="steptag"'));
  });
  return p.join('');
}

// The predicted line: a dashed teal path from the simulated run, a hollow dot where it starts and a solid one where it ends.
function renderPredicted(sel, state, ctx) {
  const s = sel.sim, k = ctx.k;
  if (!s || state.layers.pred === false) return '';
  const a = s.samples[0], z = s.samples[s.samples.length - 1];
  return '<path class="pred-line ns" d="' + linePath(drawnPath(s.samples, k)) + '"/>' +
    at(a.x, a.y, k, '<circle class="pred-start" r="4.5"/><title>Predicted start</title>') +
    at(z.x, z.y, k, '<circle class="pred-end" r="4"/><title>Predicted end, ' + fmt(s.duration, 1) + ' s in</title>');
}

function renderRaw(model, sel, ctx) {
  const s = sel.rawSession, k = ctx.k, p = [];
  if (!s) return '';
  if (s.samples.length > 1) p.push('<path class="raw-line ns" d="' + linePath(drawnPath(s.samples, k)) + '"/>');
  const tv = travelOf(s);
  s.marks.forEach((m, i) => {
    if (m.x === null || m.y === null || !MARK_KINDS.has(m.kind)) return;
    p.push(at(m.x, m.y, k, sym(m.kind, 5.2, 'sym raw') + '<title>Hand mark: ' + esc(KIND_LABEL[m.kind] || m.kind) + ' after ' + fmtIn(tv.marks[i].d, tv.inches) + ' in</title>'));
  });
  return p.join('');
}

// The first spot beside a mark where a label stays in view and clear of every Goal and Goal name. null when there is none.
function labelSpot(px, py, w, spots, field, ctx) {
  const left = ctx.win.x0 / ctx.k, right = ctx.win.x1 / ctx.k;
  const keep = [];
  field.goals.forEach((g) => { const gg = goalGeom(g, field, ctx), d = gg.disc; keep.push(gg.box, { x: d.x - d.r, y: d.y - d.r, w: 2 * d.r, h: 2 * d.r }); });
  for (const c of spots) {
    const b = { x: px + (c[0] < 0 ? c[0] - w : c[0]), y: py + c[1] - 10, w, h: 13 };
    if (b.x >= left && b.x + w <= right && keep.every((g) => b.x + b.w < g.x || b.x > g.x + g.w || b.y + b.h < g.y || b.y > g.y + g.h)) return { dx: c[0], dy: c[1], box: b };
  }
  return null;
}
// The words beside the after-opening mark. Left out on a phone, or when no spot is clear; the ring and its tooltip stay.
function openingLabel(op, field, ctx) {
  if (ctx.W < 420) return null;
  const exact = op.source === 'teach', text = exact ? 'AFTER OPENING' : 'AFTER OPENING (approx.)', a = exact ? 10 : 14;
  const spot = labelSpot(op.x / ctx.k, -op.y / ctx.k, text.length * 6.6, [[a, 15], [a, -8], [-a, 15], [-a, -8]], field, ctx);
  return spot && { text, dx: spot.dx, dy: spot.dy, box: spot.box };
}
// Where the worst miss gets its label.
function worstMark(model, sel, ctx) {
  if (!sel.runSession || !sel.rows) return null;
  const sm = runSummary(sel.rows, sel.runSession), worst = sm.worstIn !== null ? sel.rows.find((r) => r.idx === sm.worstInStep) : null;
  if (!worst || !worst.actual) return null;
  const label = fmt(sm.worstIn, 2) + ' in', px = worst.actual.x / ctx.k, py = -worst.actual.y / ctx.k;
  const spot = labelSpot(px, py, label.length * 6.8, [[12, -8], [12, 18], [-12, -8], [-12, 18]], model.field, ctx) || { dx: -12, dy: -8, box: { x: px - 12 - label.length * 6.8, y: py - 18, w: label.length * 6.8, h: 13 } };
  return { x: worst.actual.x, y: worst.actual.y, dx: spot.dx, dy: spot.dy, label, cl: rateIn(sm.worstIn), box: spot.box };
}

function renderRunOverlay(model, sel, ctx) {
  const s = sel.runSession, k = ctx.k, p = [];
  if (!s) return '';
  if (s.samples.length > 1) p.push('<path class="run-line ns" d="' + linePath(drawnPath(s.samples, k)) + '"/>');
  (sel.rows || []).forEach((r) => {
    if (!r.reached || !r.actual || !isNum(r.actual.x) || !isNum(r.actual.y)) return;
    const cl = r.ratingIn || (r.ok === false ? 'bad' : 'good');
    if (isNum(r.target.x) && isNum(r.target.y) && r.missIn !== null) {
      p.push('<line class="miss-line ' + cl + ' ns" x1="' + f3(r.target.x) + '" y1="' + f3(-r.target.y) + '" x2="' + f3(r.actual.x) + '" y2="' + f3(-r.actual.y) + '"/>');
      p.push(at(r.target.x, r.target.y, k, '<path class="target-x" d="M-3.5 -3.5L3.5 3.5M3.5 -3.5L-3.5 3.5"/>'));
    }
    p.push(at(r.actual.x, r.actual.y, k, '<circle class="miss-ring ' + cl + '" r="3.6"/><title>Step ' + r.idx + ' actual ' + fmt(r.actual.x) + ', ' + fmt(r.actual.y) + (r.missIn !== null ? ', miss ' + fmt(r.missIn, 2) + ' in' : '') + '</title>'));
  });
  const w = worstMark(model, sel, ctx);
  if (w) p.push(at(w.x, w.y, k, '<circle class="worst-ring ' + w.cl + '" r="8"/><text class="worst-text halo ' + w.cl + '" x="' + w.dx + '" y="' + w.dy + '" text-anchor="' + (w.dx < 0 ? 'end' : 'start') + '">' + w.label + '</text>'));
  return p.join('');
}

function renderPushLayer(sel, ctx) {
  const s = sel.session, k = ctx.k, p = [];
  if (s.samples.length > 1) p.push('<path class="run-line ns" d="' + linePath(drawnPath(s.samples, k)) + '"/>');
  let n = 0;
  const tv = travelOf(s);
  s.marks.forEach((m, i) => {
    if (m.x === null || m.y === null || m.type !== 'push') return;
    n++;
    p.push(at(m.x, m.y, k, sym('push', 6, 'sym') + '<g transform="translate(12 -11)">' + tagSvg(n, n, false) + '</g><title>Push ' + n + ' marked after ' + fmtIn(tv.marks[i].d, tv.inches) + ' in</title>'));
  });
  return p.join('');
}

function renderStatic(model, state, sel, ctx) {
  const p = [renderBase(model, sel, ctx)];
  if (ctx.frame === 'field') {
    p.push(renderFieldObjects(model, sel.route, ctx));
    if (model.illustrative) p.push(at(0, 0, ctx.k, '<g transform="rotate(-30)"><text class="wm" y="14">ILLUSTRATIVE SAMPLE</text></g>'));
    if (state.layers.raw) p.push(renderRaw(model, sel, ctx));
    p.push(renderRoute(model, state, sel, ctx));
    p.push(renderPredicted(sel, state, ctx)); // over the cleaned route, so a dashed line is never hidden under a solid one
    if (state.layers.run) p.push(renderRunOverlay(model, sel, ctx));
  } else {
    p.push(renderPushLayer(sel, ctx));
  }
  return p.join('');
}

function robotAt(pose, L, W, k, cls, fcls) {
  const c = footprintCorners(pose.x, pose.y, pose.h, L, W);
  return '<polygon class="' + cls + ' ns" points="' + polyPts(c) + '"/><line class="' + fcls + ' ns" x1="' + f3(c[0].x) + '" y1="' + f3(-c[0].y) + '" x2="' + f3(c[1].x) + '" y2="' + f3(-c[1].y) + '"/>';
}

function renderSel(model, state, sel, ctx) {
  const route = sel.route;
  if (ctx.frame !== 'field' || !route) return '';
  const F = model.field, k = ctx.k, p = [];
  const one = (i, cls, fcls, ring) => {
    const w = route.wp[i];
    if (!w || w.x === null) return;
    p.push(robotAt(w, F.robot.length, F.robot.width, k, cls, fcls));
    if (ring) {
      // claw direction: an arrow leaving the middle of the front edge, along the heading
      const c = footprintCorners(w.x, w.y, w.h, F.robot.length, F.robot.width);
      p.push(at((c[0].x + c[1].x) / 2, (c[0].y + c[1].y) / 2, k, '<g transform="rotate(' + f3(w.h) + ')"><path class="claw" d="M0 0V-14M-4.5 -9L0 -14L4.5 -9"/></g>'));
      p.push(at(w.x, w.y, k, '<circle class="sel-ring" r="12"/>'));
    }
  };
  if (state.hover != null && state.hover !== state.step) one(state.hover, 'hov-fp', 'hov-fp', false);
  if (state.step != null) one(state.step, 'sel-fp', 'sel-fp-front', true);
  return p.join('');
}

function renderPlay(model, state, sel, ctx) {
  const s = sel.scrub;
  if (!s) return '';
  const k = ctx.k, F = model.field, pose = interpPose(s.samples, state.t || 0);
  if (!pose) return '';
  const trail = samplesUpTo(drawnPath(s.samples, k), state.t || 0);
  if (trail.length) trail[trail.length - 1] = pose; // the trail ends where the robot is, not at the thinned path
  const out = [], pr = s.kind === 'sim' ? ' pred' : ''; // the prediction plays in its own color
  if (trail.length > 1) out.push('<path class="' + (pr ? 'pred-trail' : 'run-trail') + ' ns" d="' + linePath(trail) + '"/>');
  out.push(robotAt(pose, F.robot.length, F.robot.width, k, 'play-fp' + pr, 'play-front' + pr));
  out.push(at(pose.x, pose.y, k, '<circle class="play-dot' + pr + '" r="3"/>'));
  return out.join('');
}

/* ---------- proposed plans: the draw tool's pure parts ---------- */
// The limits are the shared contract's (ROUTE_SYNC_SPEC.md, Proposed auto plans); the relay checks them again.
const PLAN_LIMITS = { name: 80, note: 2000, lines: 50, perLine: 500, total: 3000, coord: 100, minLen: 1, tol: 1, actions: 200, detail: 120 };
const round2 = (v) => Math.round(v * 100) / 100 + 0; // + 0 turns a -0 into 0
const lineLength = (line) => { let d = 0; for (let i = 1; i < line.length; i++) d += Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]); return d; };
const planLength = (lines) => lines.reduce((a, l) => a + lineLength(l), 0);

// A screen point to field inches. inv is svg.getScreenCTM().inverse() (a to f); the svg's y runs down and the field's runs up, so y flips.
// Clamped to the wall. The + 0 keeps a -0 from reaching the plan.
function fieldFromScreen(inv, cx, cy, wall) {
  const x = inv.a * cx + inv.c * cy + inv.e, y = -(inv.b * cx + inv.d * cy + inv.f);

  const sim = model.sim, none = (t) => '<p class="predlabel none"><i></i><span>' + t + '</span></p>';
  if (!sim) return none('No prediction for this build yet. Get the latest build, then Refresh.');
  if (!sel.sim) return none(esc(isNum(sim.build) ? 'Build ' + sim.build : 'This build') + ' has no prediction for ' + esc(sel.entry ? sel.entry.label : 'this route') + '.');
  let h = '<p class="predlabel">' + PRED_SWATCH + '<span>' + esc(predLabel(sim)) + '</span></p>';
  if (isNum(model.deviceBuild) && isNum(sim.build) && model.deviceBuild !== sim.build) {
    h += '<p class="predwarn">' + WARN_ICON + '<span>This device has Build ' + model.deviceBuild + ', so this prediction is for a different build.</span></p>';
  }
  if (sim.assumptions || sim.generated) {
    h += '<details class="disc about" data-keep="about"' + isOpen(state, 'about') + '><summary>About this prediction</summary>' + (sim.assumptions ? '<p class="hint">' + esc(sim.assumptions) + '</p>' : '') +
      (sim.generated ? '<p class="hint">Generated ' + esc(genText(sim.generated)) + '</p>' : '') + '</details>';
  }
  return h;
}

// The one row that answers first: which route, did the last run hit, where it missed.
function renderSummary(model, state, sel) {
  const r = sel.route, s = sel.session;
  const stat = (label, value, more, plain) => '<div class="stat"><dt>' + label + '</dt><dd' + (plain ? ' class="plain"' : '') + '>' + value + '</dd>' + (more ? '<span class="more">' + more + '</span>' : '') + '</div>';
  let title, sub = '', stats = [];
  if (sel.frame === 'local') {
    const pd = pushDistances(s);
    title = 'Push test';
    sub = esc(when2(s));
    stats = [stat('Pushes', String(pd.rows.length)), stat('Mean', pd.mean !== null ? fmt(pd.mean, 2) + ' in' : 'n/a'), stat('Spread', pd.spread !== null ? fmt(pd.spread, 2) + ' in' : 'n/a')];
  } else {
    title = r ? esc(sel.entry ? sel.entry.label : 'Route ' + r.slot) : s ? esc(sessionLabel(s)) : sel.entry ? esc(sel.entry.label) : 'No route selected';
    if (r) sub = esc(r.note || (s ? sessionLabel(s) + ', ' + when2(s) : r.steps.length + ' steps'));
    else if (s && s.kind === 'run' && model.routes.length) sub = esc(when2(s)) + '. ' + (s.for_slot ? 'Route ' + esc(s.for_slot) + ' has different steps now, so this run is drawn on its own.' : 'This run names no route, so it is drawn on its own.');
    else if (s) sub = esc(when2(s)) + '. No cleaned route here: routes come from the laptop tool.';
    else if (model.sessions.length && !sel.sim) sub = 'Pick a session to see it on the field.';
    const latest = lastRun(model, r), run = sel.runSession || (sel.mirror ? mirroredSession(latest) : latest);
    if (!r && !s && sel.sim) {
      stats = [stat('Predicted time', fmtS(sel.sim.total))];
      if (sel.sim.events.length > 1) stats.push(stat('Steps', String(sel.sim.events.length))); // one event is just the opening, not a list of steps
      stats.push(stat('Side', sel.sim.side === 'R' ? 'Right' : 'Left'));
    } else if (run) {
      const sm = runSummary(sel.runSession ? sel.rows : missRows(r, run), run), label = latest && run.id === latest.id ? 'Last run' : 'This run';
      if (sm.worstIn !== null) {
        const rt = rateIn(sm.worstIn);
        stats.push(stat(label, '<i class="' + rt + '"></i>' + fmt(sm.worstIn, 2) + ' in<span class="sr">, rated ' + rt + '</span>', 'worst, step ' + sm.worstInStep));
      } else stats.push(stat(label, '<i class="idle"></i>No scored steps', '', true));
      if (r) stats.push(stat('Pins planned', pinsTotal(r)));
      stats.push(stat('Run time', fmtS(sm.total)));
    } else {
      stats.push(stat('Last run', '<i class="idle"></i>' + (r ? 'No run for this route yet' : 'No run yet'), '', true));
      if (r) stats.push(stat('Pins planned', pinsTotal(r)), stat('Estimate', isNum(r.checks.estimated_s) ? fmt(r.checks.estimated_s, 1) + ' s' : 'n/a'));
    }
  }
  return '<div class="sum-row"><div class="sum-title"><h2>' + title + '</h2>' + (sub ? '<p class="sum-sub">' + sub + '</p>' : '') + '</div><dl class="stats">' + stats.join('') + '</dl></div>' +
    predBlock(model, state, sel) + (model.note ? '<p class="notel">' + esc(model.note) + '</p>' : '');
}
function pinsTotal(r) {
  const k = Object.keys(r.checks.pins);
  return k.length ? String(k.reduce((a, g) => a + r.checks.pins[g], 0)) : 'n/a';
}

function renderWarn(model, sel, state) {
  const items = [];
  let bad = false;
  const li = (who, text, cls) => '<li' + (cls ? ' class="' + cls + '"' : '') + '><span class="who">' + esc(who) + '</span><br>' + esc(text) + '</li>';
  arr(model.rejected).forEach((x) => items.push(li(x.file, x.text)));
  if (sel.route) sel.route.checks.warnings.forEach((w) => items.push(li('Route ' + sel.route.slot, w)));
  (sel.contactList || []).forEach((c) => {
    if (c.severity === 'bad') bad = true;
    items.push(li('Route ' + sel.route.slot + ', step ' + c.step, c.text, c.severity === 'bad' ? 'bad' : ''));
  });
  if (!items.length) return sel.route ? '<div class="calmline"><i class="good"></i>No warnings on this route</div>' : ''; // a prediction has no checks to pass or fail
  return '<details class="disc warnline' + (bad ? ' bad' : '') + '" data-keep="warn"' + isOpen(state, 'warn') + '><summary>' + WARN_ICON + '<span>' + plural(items.length, 'warning') + '</span></summary><ul class="warnlist">' + items.join('') + '</ul></details>';
}

const LIST_SHORT = 5;
// Only recordings, and only the ones under the picked route: a group with nothing in it is left out, and so is the whole list.
function renderLists(model, state, sel) {
  const p = [], more = state.more || {}, mine = listedSessions(model, sel ? sel.entry : null);
  // Runs come first and each group has its own heading. A long group shows its newest rows and says how many more there are.
  const groups = [['run', 'Runs', (s) => s.kind === 'run'], ['teach', 'Taught', (s) => s.kind.indexOf('teach') === 0], ['push', 'Push tests', (s) => s.kind === 'push']];
  const shown = new Set();
  groups.concat([['other', 'Other', () => true]]).forEach((g) => {
    const list = mine.filter((s) => !shown.has(s.id) && g[2](s)).sort((a, b) => (whenFine(a) < whenFine(b) ? 1 : whenFine(a) > whenFine(b) ? -1 : 0));
    list.forEach((s) => shown.add(s.id));
    if (!list.length) return;
    const picked = list.some((s) => s.id === state.session);
    p.push('<div class="grouphead">' + g[1] + ' <span class="num">' + list.length + '</span>' + (picked ? '<button type="button" class="linkbtn" data-key="clear" data-clear="1">Clear</button>' : '') + '</div>');
    const rows = more[g[0]] ? list : list.filter((s, i) => i < LIST_SHORT || s.id === state.session);
    p.push('<ul class="rowlist">');
    rows.forEach((s) => {
      let title = sessionLabel(s), extra = '', note = '';
      if (s.kind === 'run') {
        const route = model.routes.find((r) => runMatchesRoute(r, s)) || null;
        const sim = title.endsWith(' (simulated)') ? ' (simulated)' : '';
        title = s.for_slot ? 'Route ' + s.for_slot + sim : title;
        if (s.for_slot && !route) note = 'route has changed';
        const sum = runSummary(missRows(route, s), s);
        extra = sum.worstIn !== null ? '<span class="row-x pill ' + rateIn(sum.worstIn) + '"><i class="' + rateIn(sum.worstIn) + '"></i>' + fmt(sum.worstIn, 2) + ' in</span>' : '<span class="row-x txt">no scored steps</span>';
      } else if (s.kind === 'push') {
        extra = '<span class="row-x txt">' + plural(s.marks.filter((m) => m.type === 'push').length, 'push', 'pushes') + '</span>';
      }
      const bits = [when2(s), s.side ? 'side ' + s.side : '', s.samples.length ? (isHand(s) ? handLength(s) : fmt(s.duration, 1) + ' s') : 'no samples', s.kind !== 'run' && s.for_slot ? 'route ' + s.for_slot : '', note].filter(Boolean);
      p.push('<li><button type="button" class="row" title="' + esc(s.id) + '" data-key="ses-' + esc(s.id) + '" data-session="' + esc(s.id) + '" aria-pressed="' + (state.session === s.id) + '"><span class="row-t">' + esc(title) + '</span>' + extra + '<span class="row-m">' + esc(bits.join(' · ')) + '</span></button></li>');
    });
    p.push('</ul>');
    if (list.length > LIST_SHORT) p.push('<button type="button" class="morebtn" data-key="more-' + g[0] + '" data-more="' + g[0] + '">' + (more[g[0]] ? 'Show fewer' : 'Show all ' + list.length) + '</button>');
  });
  return p.join('');
}

function layerSwatch(id) {
  const s = {
    pred: '<line x1="1" y1="6" x2="21" y2="6" stroke="var(--pred)" stroke-width="2.4" stroke-dasharray="5 3.5" stroke-linecap="round"/>',
    route: '<line x1="1" y1="6" x2="21" y2="6" stroke="var(--route)" stroke-width="2.5" stroke-linecap="round"/>',
    raw: '<path d="M1 8 C5 2,8 10,12 5 S18 7,21 4" fill="none" stroke="var(--raw)" stroke-width="1.4"/>',
    run: '<line x1="1" y1="6" x2="21" y2="6" stroke="var(--run)" stroke-width="2.2" stroke-linecap="round"/>',
    plan: '<line x1="1" y1="6" x2="21" y2="6" stroke="var(--plan)" stroke-width="3" stroke-linecap="round"/>',
    foot: '<rect x="4" y="0.5" width="14" height="11" fill="none" stroke="var(--route)" stroke-width="1" opacity="0.7"/><line x1="4" y1="0.5" x2="18" y2="0.5" stroke="var(--route)" stroke-width="2.5"/>',
    sweep: '<rect x="1" y="1" width="20" height="10" fill="var(--route)" fill-opacity="0.12" stroke="var(--route)" stroke-dasharray="3 2"/>',
    tags: '<rect x="3" y="-1" width="16" height="14" rx="3.5" fill="var(--solid)" stroke="var(--text-2)"/><text x="11" y="9.5" font-size="10" font-weight="600" text-anchor="middle" fill="var(--text)">3</text>',
  };
  return '<svg class="sw" viewBox="0 0 22 12" aria-hidden="true">' + s[id] + '</svg>';
}
const LAYER_DEFS = [['pred', 'Predicted route'], ['route', 'Cleaned route'], ['raw', 'Raw hand path'], ['run', 'Run path'], ['foot', 'Footprints'], ['sweep', 'Swept outline'], ['tags', 'Step numbers']];
// A layer is offered only when there is data for it on the picked route.
function layerAvail(sel) {
  const f = sel.frame === 'field', has = !!sel.route && f;
  return { pred: !!sel.sim, route: has, raw: !!sel.rawSession && f, run: !!sel.runSession && f, foot: has, sweep: has, tags: has };
}
function renderLayers(model, state, sel) {
  const seg = (v, label, on) => '<button type="button" data-key="view-' + v + '" data-view="' + v + '" aria-pressed="' + on + '">' + label + '</button>';
  const entries = routeEntries(model), sides = sel.entry ? ['L', 'R'].filter((sd) => sel.entry.sim[sd]) : [];
  const pick = entries.length > 1 ? '<div class="seg" role="group" aria-label="Route">' + entries.map((x) => '<button type="button" data-key="pick-' + esc(x.key) + '" data-pick="' + esc(x.key) + '" aria-pressed="' + (sel.entry === x) + '">' + esc(x.label) + '</button>').join('') + '</div>' : '';
  // Drawing with nothing predicted still needs a side to pick; a plan has one side, so the control locks once there is a line.
  const drawing = !!state.draw, locked = drawing && state.draft > 0;
  const side = sides.length > 1 || (drawing && !sides.length) ? '<div class="seg" role="group" aria-label="Side">' + ['L', 'R'].map((sd) => '<button type="button" data-key="side-' + sd + '" data-side="' + sd + '" aria-pressed="' + (sel.sim ? sel.sim.side === sd : (state.side || 'L') === sd) + '"' + (locked ? ' disabled' : '') + '>' + (sd === 'L' ? 'Left' : 'Right') + '</button>').join('') + '</div>' : '';
  const view = '<div class="seg" role="group" aria-label="Map view">' + seg('fit', 'Fit route', sel.viewMode !== 'field') + seg('field', 'Whole field', sel.viewMode === 'field') + '</div>';
  const av = layerAvail(sel), defs = LAYER_DEFS.filter((d) => av[d[0]]);
  const rows = defs.map((d) => '<button type="button" class="menu-row" data-key="layer-' + d[0] + '" data-layer="' + d[0] + '" aria-pressed="' + !!state.layers[d[0]] + '"><svg class="chk" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9.5 10 3"/></svg>' + layerSwatch(d[0]) + '<span>' + esc(d[1]) + '</span></button>').join('');
  const menu = defs.length > 1 ? '<details class="menu" data-keep="layers"' + isOpen(state, 'layers') + '><summary><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 13 4.7 7 8 1 4.7z"/><path d="M1 7.6 7 10.9 13 7.6"/></svg>Layers</summary><div class="menu-pop" role="group" aria-label="Map layers">' + rows + '</div></details>' : '';
  const draw = state.canDraw ? '<button type="button" class="drawbtn" data-key="draw" data-opendraw="1"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.2 11.8 2.8 9 9.6 2.2a1.1 1.1 0 0 1 1.6 0l.6.6a1.1 1.1 0 0 1 0 1.6L5 11.2z"/><path d="M8.4 3.4l2.2 2.2"/></svg>' + (state.draft ? 'Continue plan' : 'Draw a plan') + '</button>' : '';
  if (drawing) return pick + side ? '<div class="tb tb-left">' + pick + side + '</div>' : '';
  return '<div class="tb tb-left">' + pick + side + '</div><div class="tb tb-right">' + view + menu + draw + '</div>';
}
// One chip per line that is drawn, under the map, so the dashed line always has its own entry.
function renderKey(state, sel) {
  if (sel.frame !== 'field') return '';
  const on = (id) => (id === 'pred' ? state.layers.pred !== false : !!state.layers[id]);
  const items = [];
  if (sel.sim && on('pred')) items.push(['pred', 'Predicted route']);
  if (sel.route && on('route')) items.push(['route', 'Cleaned route']);
  if (sel.rawSession && on('raw')) items.push(['raw', 'Raw hand path']);
  if (sel.runSession && on('run')) items.push(['run', 'Run path']);
  if (state.draw) items.push(['plan', 'Proposed plan']);
  return items.map((d) => '<span class="key">' + layerSwatch(d[0]) + d[1] + '</span>').join('');
}
// Which of the two paths the transport plays, offered only when both are on the map.
function renderPlaySrc(state, sel) {
  if (!sel.sim || state.layers.pred === false || !sel.session || !sel.session.samples.length) return '';
  const b = (v, label) => '<button type="button" data-key="play-' + v + '" data-play="' + v + '" aria-pressed="' + (v === 'pred' ? sel.scrub === sel.sim : sel.scrub !== sel.sim) + '">' + label + '</button>';
  return b('pred', 'Predicted') + b('rec', 'Recorded');
}

function stepDetailHtml(model, state, sel, i) {
  const route = sel.route;
  const s = route.steps[i], w = route.wp[i];
  if (!s) return '';
  const kv = [];
  const na = '<span class="na" title="not in the data">n/a</span>';
  kv.push(['Kind', esc(KIND_LABEL[s.kind] || s.kind)]);
  if (route.opening && w && w.x !== null && route.steps.findIndex((q, j) => route.wp[j] && route.wp[j].x !== null) === i) {
    kv.push(['After opening', fmt(route.opening.x) + ', ' + fmt(route.opening.y) + ' in' + (route.opening.source === 'teach' ? ' <span class="muted">(first teach sample)</span>' : ' <span class="muted">(approx., first waypoint)</span>')]);
  }
    if (w && w.x !== null) kv.push(['Position', fmt(w.x) + ', ' + fmt(w.y) + ' in' + (w.src === 'carried' ? ' <span class="muted">(where the robot already is)</span>' : '')]);
  else kv.push(['Position', na]);
  kv.push(['Heading', w && w.hKnown ? fmt(w.h) + ' deg' : na]);
  if (s.raw_heading !== null) kv.push(['Raw heading', fmt(s.raw_heading) + ' deg' + (s.heading !== null && Math.abs(wrap180(s.raw_heading - s.heading)) > 0.5 ? ' <span class="muted">(snapped to ' + fmt(s.heading) + ')</span>' : '')]);
  if (s.kind === 'drop') kv.push(['Lift height', s.lift !== null ? fmt(s.lift, 0) + ' deg' : na], ['Goal', s.goal ? esc(shortName(s.goal)) : na]);
  if (s.kind === 'grab_stack' || s.kind === 'grab_pin') kv.push(['Lift for next drop', s.drop_lift !== null ? fmt(s.drop_lift, 0) + ' deg' : na]);
  if (s.kind === 'drive') kv.push(['Direction', s.forwards === null ? na : s.forwards ? 'forwards' : 'in reverse'], ['Approach', s.approach === null ? na : s.approach ? 'yes, slowed for a mark' : 'no']);
  if (s.kind === 'toggle') kv.push(['Action', 'Turns the Toggle at this spot']);
  const row = sel.rows ? sel.rows.find((r) => r.idx === i) : null;
  if (sel.runSession) {
    if (row && row.reached) {
      kv.push(['Run actual', fmt(row.actual.x) + ', ' + fmt(row.actual.y) + ' in, ' + fmt(row.actual.h) + ' deg']);
      const tgt = [NO_POS.has(s.kind) ? '' : fmt(row.target.x) + ', ' + fmt(row.target.y) + ' in', NO_HEAD.has(s.kind) ? '' : fmt(row.target.h) + ' deg'].filter(Boolean);
      kv.push(['Run target', tgt.length ? tgt.join(', ') : '-']);
      kv.push(['Miss', (row.missIn !== null ? '<span class="pill ' + row.ratingIn + '"><i class="' + row.ratingIn + '"></i>' + fmt(row.missIn, 2) + ' in</span> ' : '') + (row.missDeg !== null ? '<span class="pill ' + row.ratingDeg + '"><i class="' + row.ratingDeg + '"></i>' + fmt(row.missDeg, 1) + ' deg</span>' : '') + (row.missIn === null && row.missDeg === null ? '<span class="muted">not scored for this step kind</span>' : '')]);
      kv.push(['Finished at', fmt(row.t, 2) + ' s' + (row.ok === false ? ' <span class="pill bad"><i class="bad"></i>step reported failure</span>' : '')]);
    } else kv.push(['Run', '<span class="muted">no result logged for this step</span>']);
  }
  const cs = contactsAt(sel.contactList, i);
  if (cs.length) kv.push(['Map check', cs.map((c) => '<span class="' + (c.severity === 'bad' ? 'bad' : 'warn') + '" style="stroke:none">' + esc(c.text) + '</span>').join('<br>')]);
  return '<h3>Step ' + i + ': ' + esc(KIND_LABEL[s.kind] || s.kind) + '</h3><dl class="kv">' + kv.map((r) => '<dt>' + r[0] + '</dt><dd' + (/^-?\d/.test(r[1]) ? ' class="num"' : '') + '>' + r[1] + '</dd>').join('') + '</dl>';
}

function pushPanel(sel) {
  const pd = pushDistances(sel.session);
  let h = '<h3>Push test</h3>';
  if (!pd.rows.length) return h + '<p class="hint">No push marks in this session.</p>';
  if (!pd.hasSamples) return h + '<p class="hint">' + pd.rows.length + ' push mark' + (pd.rows.length === 1 ? '' : 's') + ' found, but this session has no samples, so no distances are shown.</p>';
  const mx = pd.max || 1;
  h += '<p class="hint" style="margin-bottom:8px">Straight-line distance from the first sample (the start pose) to each push mark. This assumes the robot was dragged back to the start each time. The pass or fail verdict comes from the laptop tool.</p>';
  h += pd.rows.map((r) => '<div class="pinrow"><span>Push ' + r.n + '</span><span>' + fmt(r.dist, 2) + ' in</span></div>' + (r.dist !== null ? '<span class="minibar" style="width:' + Math.max(2, (r.dist / mx) * 100).toFixed(1) + '%"></span>' : '')).join('');
  h += '<dl class="kv" style="margin-top:10px"><dt>Mean</dt><dd>' + fmt(pd.mean, 2) + ' in</dd><dt>Spread</dt><dd>' + (pd.spread !== null ? fmt(pd.spread, 2) + ' in (max minus min)' : 'needs 2 or more pushes') + '</dd></dl>';
  return h;
}

function renderInspector(model, state, sel) {
  if (!sel.route && !sel.session && !model.sessions.length) return ''; // a prediction alone has no details to list
  const p = [];
  const active = state.hover != null ? state.hover : state.step;
  if (sel.frame === 'local') p.push('<div class="panel pad">' + pushPanel(sel) + '</div>');
  else if (sel.route && active != null && sel.route.steps[active]) p.push('<div class="panel pad" id="stepbox">' + stepDetailHtml(model, state, sel, active) + '</div>');
  else if (sel.route) {

    }
    state.t = 0; state.hover = null;
    refresh();
  }
  function seekToStep(i) {
    const rows = last.sel.rows;
    if (!rows || last.sel.scrub !== last.sel.runSession) return; // step times belong to the run, not to the prediction
    const r = rows.find((x) => x.idx === i && x.reached);
    if (r && isNum(r.t)) state.t = Math.min(r.t, last.sel.scrub ? last.sel.scrub.duration : r.t);
  }
  function selectStep(i, seek) {
    if (!model.routes.length || state.route == null) return;
    state.step = i;
    if (seek) seekToStep(i);
    refreshStep();
    refreshPlay();
    const r = model.routes[state.route];
    $('live').textContent = r.steps[i] ? 'Step ' + i + ', ' + (KIND_LABEL[r.steps[i].kind] || r.steps[i].kind) : '';
  }
  function stepBy(d) {
    const r = state.route != null ? model.routes[state.route] : null;
    if (!r || !r.steps.length) return;
    const n = r.steps.length;
    const next = state.step == null ? (d > 0 ? 0 : n - 1) : Math.max(0, Math.min(n - 1, state.step + d));
    selectStep(next, true);
  }
  function tick(ts) {
    if (!state.playing) return;
    const dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
    const s = last.sel.scrub;
    state.t += dt * state.speed * playRate(s); // a hand recording plays on travel, so its units per second differ from a clock's
    if (s && state.t >= s.duration) { state.t = s.duration; state.playing = false; }
    refreshPlay();
    if (state.playing) raf = requestAnimationFrame(tick);
  }
  function togglePlay() {
    const s = last.sel.scrub;
    if (!s || !(s.duration > 0)) return;
    if (state.playing) { stop(); refreshPlay(); return; }
    if (state.t >= s.duration - 1e-6) state.t = 0;
    state.playing = true; lastTs = performance.now(); raf = requestAnimationFrame(tick);
    refreshPlay();
  }

  /* ----- proposed plan: the draw tool ----- */
  const DRAFT_KEY = 'scourge-plan-draft', SEND_WAIT_MS = 100000, STROKE_CAP = 20000;
  const nameIn = $('plan-name'), noteIn = $('plan-note');
  // The draft (lines, actions, name, note, side) is kept where storage works; a blocked or full store just means it is not kept.
  function saveDraft() {
    try {
      if (plan.lines.length || plan.name || plan.note) localStorage.setItem(DRAFT_KEY, JSON.stringify({ lines: plan.lines, actions: plan.actions, name: plan.name, note: plan.note, side: plan.side }));
      else localStorage.removeItem(DRAFT_KEY);
    } catch (err) { /* no storage here */ }
  }
  function loadDraft() {
    if (!canDraw()) return;
    try {
      const raw = localStorage.getItem(DRAFT_KEY), d = raw ? sanitizeDraft(JSON.parse(raw)) : null;
      if (d) { plan.lines = d.lines; plan.actions = d.actions; plan.name = d.name; plan.note = d.note; plan.side = d.side; nameIn.value = d.name; noteIn.value = d.note; }
    } catch (err) { /* nothing saved, or not readable */ }
  }
  // Which side the lines belong to is the side showing when the first one was drawn; after that the page holds it.
  const showingSide = () => (last.msel.mirror ? 'R' : 'L');
  function keepPlanSide() { if (plan.on && plan.lines.length && plan.side) { state.side = plan.side; state.sideSet = true; } }
  function setMsg(text, kind) { plan.msg = text ? { text, kind } : null; }
  function paintDraw() {
    app.dataset.draw = plan.on ? '1' : '0';
    $('drawmode').hidden = !plan.on; $('drawbar').hidden = !plan.on;
    if (!plan.on) return;
    const n = plan.lines.length, busy = plan.sending, named = plan.name.trim().length > 0;
    $('draw-undo').disabled = busy || !plan.undo.length;
    $('draw-clear').disabled = busy || !n;
    $('draw-done').disabled = busy;
    $('draw-send').disabled = busy || !n || !named;
    $('draw-send').textContent = busy ? 'Sending…' : 'Send plan';
    nameIn.readOnly = busy; noteIn.readOnly = busy;
    paintActions();
    $('drawcount').textContent = n ? plural(n, 'line') + ', ' + fmt(planLength(plan.lines), 0) + ' in total' + (plan.actions.length ? '' : '. Tap a line to add an action.') : 'Drag on the field to draw a line. Each line runs from its dot to its arrow.';
    const m = plan.msg || (n && !named ? { text: 'Name the plan to send it.', kind: 'idle' } : null), el = $('drawmsg');
    el.hidden = !m;
    if (m) { el.className = 'drawmsg pill ' + m.kind; el.firstChild.className = m.kind; el.firstChild.hidden = m.kind === 'idle'; el.lastChild.textContent = m.text; } // textContent: the host's words are never markup
  }
  function paintStroke() { put($('g-plan'), renderPlan(drawNow(), last.ctx)); }
  // The Actions list. Its rows are rewritten only when something but the typing changed; the detail text lives in each input's value, not in
  // the markup, so a repaint puts the same text back and keeps the focus and the caret where they were.
  function paintActions() {
    const list = $('actlist'), a = plan.actions;
    $('actbox').hidden = !a.length;
    $('actcount').textContent = a.length ? plural(a.length, 'action') : '';
    const was = document.activeElement, typing = was && was.dataset && was.dataset.aid !== undefined, from = typing ? was.selectionStart : null, to = typing ? was.selectionEnd : null;
    keepFocus(() => put(list, renderActionRows(a, plan.lines, model.field)));
    list.querySelectorAll('input[data-aid]').forEach((inp) => {
      const x = a[+inp.dataset.aid];
      if (x && inp.value !== x.detail) inp.value = x.detail;
      inp.readOnly = plan.sending;
    });
    document.querySelectorAll('#actlist .actrm').forEach((b) => { b.disabled = plan.sending; });
    const now = document.activeElement;
    if (typing && now && now.dataset && now.dataset.aid === was.dataset.aid && now !== was && now.setSelectionRange) now.setSelectionRange(from, to);
  }
  // Every change to the lines is one step Undo can take back, Clear included.
  // An action's detail is edited in place, so every snapshot shares it and Undo never brings back an older wording.
  function commit(lines, side, actions) {
    plan.undo.push({ lines: plan.lines, side: plan.side, actions: plan.actions });
    if (plan.undo.length > 100) plan.undo.shift();
    plan.lines = lines; plan.side = lines.length ? side : null; plan.actions = actions || plan.actions; plan.msg = null;
    closePicker();
    saveDraft(); refresh();
  }
  function undoLine() {
    if (plan.sending || !plan.undo.length) return;
    const u = plan.undo.pop();
    plan.lines = u.lines; plan.side = u.side; plan.actions = u.actions; plan.msg = null;
    closePicker();
    keepPlanSide();
    saveDraft(); refresh();
  }
  function clearLines() { if (!plan.sending && plan.lines.length) commit([], null, []); }
  function enterDraw() {
    if (plan.on || !canDraw()) return;
    stop();
    plan.on = true; plan.msg = null;
    keepPlanSide();
    state.hover = null;
    refresh();
  }
  function leaveDraw() {
    if (!plan.on || plan.sending) return;
    cancelStroke(); closePicker();
    plan.on = false;
    saveDraft(); refresh();
  }

  // Pointer events with capture, so a mouse, a trackpad and a finger all draw, and a drag that leaves the map still ends cleanly.
  const toField = (e) => { const m = svg.getScreenCTM(); return m ? fieldFromScreen(m.inverse(), e.clientX, e.clientY, model.field.wall) : null; };
  function dropStroke() {
    const id = plan.pointer;
    plan.stroke = null; plan.pointer = null;
    try { if (id !== null && svg.hasPointerCapture(id)) svg.releasePointerCapture(id); } catch (err) { /* already released */ }
  }
  function cancelStroke() { if (plan.stroke) { dropStroke(); paintStroke(); } }
  svg.addEventListener('pointerdown', (e) => {
    if (plan.pick) closePicker(); // a touch on the map outside the picker closes it, then goes on to draw or to pick again
    if (!plan.on || plan.sending || plan.stroke || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const p = toField(e);
    if (!p) return;
    e.preventDefault();
    plan.stroke = [p]; plan.pointer = e.pointerId;
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* the stroke still follows the pointer over the map */ }
    paintStroke();
  });
  svg.addEventListener('pointermove', (e) => {
    if (!plan.stroke || e.pointerId !== plan.pointer) return;
    const p = toField(e), q = plan.stroke[plan.stroke.length - 1];
    if (!p || plan.stroke.length >= STROKE_CAP || Math.hypot(p.x - q.x, p.y - q.y) < last.ctx.k * 1.5) return; // under 1.5 px apart adds nothing
    plan.stroke.push(p);
    paintStroke();
  });
  svg.addEventListener('pointerup', (e) => {
    if (!plan.stroke || e.pointerId !== plan.pointer) return;
    const p = toField(e), s = plan.stroke;
    if (p) s.push(p);
    dropStroke();
    if (strokeMoved(s) < tapSlop()) { paintStroke(); tapAt(s[0], e); return; } // a tap: it picks a spot on a line, it never draws
    const line = strokeToLine(s); // null for a drag under 1 in: nothing is added
    if (!line) { paintStroke(); return; }
    const r = addPlanLine(plan.lines, line);
    if (r.error) { setMsg(r.error, 'warn'); paintStroke(); paintDraw(); return; }
    commit(r.lines, plan.lines.length ? plan.side : showingSide());
  });
  svg.addEventListener('pointercancel', (e) => { if (plan.stroke && e.pointerId === plan.pointer) cancelStroke(); }); // the browser took the gesture: the half-drawn line is thrown away
  svg.addEventListener('lostpointercapture', (e) => { if (plan.stroke && e.pointerId === plan.pointer) cancelStroke(); });

  // A release with under 1 in of movement is a tap, but a finger rarely holds that still: on a phone 1 in is about 2 px, so up to 6 px of slop counts as a tap too.
  const strokeMoved = (pts) => { let d = 0; for (let i = 1; i < pts.length; i++) d += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return d; };
  const tapSlop = () => Math.max(PLAN_LIMITS.minLen, 6 * last.ctx.k);
  const pickerEl = $('picker'), pickBox = $('mapbox');
  pickerEl.innerHTML = renderPicker();
  function closePicker() {
    if (!plan.pick) return;
    plan.pick = null; pickerEl.hidden = true;
    paintStroke();
  }
  // A tap near a line opens the picker beside it; a tap near nothing says what to do. With no lines yet the hint under the map already says to drag.
  function tapAt(p, e) {
    if (plan.sending || !plan.lines.length) return;
    const reach = Math.max(4, 24 * last.ctx.k); // 4 in, or 24 px when that is bigger, so a finger can hit a line
    const hit = snapToLines(plan.lines, p.x, p.y, reach);
    if (!hit) { setMsg('Tap on a line to add what the robot does there.', 'idle'); paintDraw(); return; }
    plan.msg = null; plan.pick = hit; plan.pickAt = performance.now();
    $('pick-title').textContent = actionPlace(hit, plan.lines);
    const r = pickBox.getBoundingClientRect(), box = { w: r.width, h: r.height };
    pickerEl.hidden = false; delete pickerEl.dataset.dock;
    pickerEl.style.left = '0px'; pickerEl.style.top = '0px'; // measured where it is, then moved
    const pr = pickerEl.getBoundingClientRect(), spot = placePicker(box, { x: e.clientX - (r.left || 0), y: e.clientY - (r.top || 0) }, { w: pr.width, h: pr.height });
    if (spot.dock) { pickerEl.dataset.dock = spot.dock; pickerEl.style.left = ''; pickerEl.style.top = ''; } else { pickerEl.style.left = f3(spot.left) + 'px'; pickerEl.style.top = f3(spot.top) + 'px'; }
    $('pick-body').scrollTop = 0;
    paintStroke(); paintDraw();
  }
  function addAction(type) {
    const hit = plan.pick;
    if (!hit || !ACTION_BY_TYPE[type] || plan.sending) return;
    if (plan.actions.length >= PLAN_LIMITS.actions) { closePicker(); setMsg('A plan holds up to ' + PLAN_LIMITS.actions + ' actions. Remove one to add another.', 'warn'); paintDraw(); return; }
    commit(plan.lines, plan.side, sortActions(plan.actions.concat([{ type, line: hit.line, along: hit.along, at: hit.at, detail: '' }])));
  }
  function removeAction(i) {
    if (plan.sending || !plan.actions[i]) return;
    plan.hot = null;
    commit(plan.lines, plan.side, plan.actions.filter((a, j) => j !== i));
  }
  function setHot(i) { if (plan.hot !== i) { plan.hot = i; paintStroke(); } }

  // Send: the host gets { id, plan } and answers with the same id. Nothing is sent that breaks a limit, and a failure never touches the drawing.
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'plan-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
  function postPlan(id, body) {
    try {
      const h = planHost();
      if (h) { h.postMessage({ id, plan: body }); return true; }
      if (window.parent !== window) { window.parent.postMessage({ type: 'scourge-plan-send', id, plan: body }, /^https?:/.test(location.origin) ? location.origin : '*'); return true; }
    } catch (err) { /* handled below */ }
    return false;
  }
  function sendPlan() {
    if (!plan.on || plan.sending) return;
    const body = buildPlan({ name: plan.name, note: plan.note, side: plan.side, build: last.msel.sim && model.sim ? model.sim.tag : null, lines: plan.lines, actions: plan.actions });
    const bad = validatePlan(body);
    if (bad) { setMsg(bad, 'warn'); paintDraw(); return; }
    const id = newId();
    if (!postPlan(id, body)) { setMsg('This page has no app to send the plan to. Your drawing is still here.', 'warn'); paintDraw(); return; }
    plan.sending = true; plan.sendId = id; plan.msg = null; closePicker();
    clearTimeout(plan.timer);
    plan.timer = setTimeout(() => {
      if (!plan.sending || plan.sendId !== id) return;
      plan.sending = false; plan.sendId = null;
      setMsg('No answer after 100 seconds. Your drawing is still here, so you can send it again.', 'warn');
      paintDraw();
    }, SEND_WAIT_MS);
    paintDraw();
  }
  // The host's answer. Anything that is not for the send being waited on is ignored.
  function planResult(r) {
    if (!r || typeof r !== 'object' || !plan.sending || r.id !== plan.sendId) return false;
    clearTimeout(plan.timer);
    plan.sending = false; plan.sendId = null;
    const ok = r.ok === true || r.ok === 1;
    const text = (typeof r.message === 'string' && r.message ? r.message : ok ? 'Sent as a proposed plan. No robot code changed.' : 'The plan did not send. Your drawing is still here.').slice(0, 300);
    if (ok) {
      plan.lines = []; plan.actions = []; plan.side = null; plan.undo = []; plan.hot = null; plan.name = ''; plan.note = ''; nameIn.value = ''; noteIn.value = '';
      saveDraft();
    }
    setMsg(text, ok ? 'good' : 'warn');
    refresh();
    return true;
  }
  $('draw-done').addEventListener('click', leaveDraw);
  $('draw-undo').addEventListener('click', undoLine);
  $('draw-clear').addEventListener('click', clearLines);
  $('draw-send').addEventListener('click', sendPlan);
  // The detail box is typing, not an Undo step: it only changes the action and the saved draft, and the list is not repainted under the caret.
  $('actlist').addEventListener('input', (e) => {
    const n = e.target && e.target.closest ? e.target.closest('[data-aid]') : null, a = n ? plan.actions[+n.dataset.aid] : null;
    if (!a || plan.sending) return;
    a.detail = String(n.value).slice(0, PLAN_LIMITS.detail);
    saveDraft();
  });
  // Pointing at a row (or tabbing to its box) lights that action's marker on the map.
  const rowOf = (e) => { const n = e.target && e.target.closest ? e.target.closest('[data-row]') : null; return n ? +n.dataset.row : null; };
  $('actlist').addEventListener('mouseover', (e) => setHot(rowOf(e)));
  $('actlist').addEventListener('mouseleave', () => setHot(null));
  $('actlist').addEventListener('focusin', (e) => setHot(rowOf(e)));
  $('actlist').addEventListener('focusout', () => setHot(null));
  nameIn.addEventListener('input', () => { plan.name = nameIn.value; if (!plan.sending) plan.msg = null; saveDraft(); paintDraw(); });
  noteIn.addEventListener('input', () => { plan.note = noteIn.value; if (!plan.sending) plan.msg = null; saveDraft(); paintDraw(); });
  loadDraft();

  /* ----- host ----- */
  function load(input) {
    stop();
    model = buildModel(input);
    model.illustrative = false; // only the page's own sample is ever a sample
    $('samplebadge').hidden = true;
    $('gen').textContent = '';
    // A pick, a side or a playing choice the person made is kept; anything else is chosen again from what arrived.
    Object.assign(state, pickView(model, { pick: state.picked ? state.pick : null, side: state.side, sideSet: state.sideSet, session: state.session, step: state.step, cleared: state.cleared }));
    keepPlanSide();
    if (!state.playPicked) state.play = defaultPlay();
    state.hover = null; state.t = 0;
    W = svg.getBoundingClientRect().width || W;
    refresh();
    syncLists();
    return { routes: model.routes.length, sessions: model.sessions.length, rejected: model.rejected.length };
  }
  window.ScourgeMap = { load, planResult };
  window.addEventListener('message', (e) => {
    if (e.source === window.parent && hostAllowed(location.origin, e.origin) && e.data) {
      if (e.data.type === 'scourge-map-load') load(e.data.input);
      else if (e.data.type === 'scourge-plan-result') planResult(e.data);
    }
  });

  /* ----- events ----- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest ? e.target : null;
    if (!el) return;
    const menu = document.querySelector('details.menu[open]');
    if (menu && !el.closest('details.menu')) menu.open = false;
    let n;
    if ((n = el.closest('[data-more]'))) { state.more[n.dataset.more] = !state.more[n.dataset.more]; keepFocus(() => put($('listbody'), renderLists(model, state, last.sel))); return; }
    if ((n = el.closest('[data-actrm]'))) return removeAction(+n.dataset.actrm);
    if ((n = el.closest('[data-pickact]'))) { if (performance.now() - plan.pickAt > 250) addAction(n.dataset.pickact); return; } // not a touch's own click, still on its way
    if (el.closest('[data-pickclose]')) return closePicker();
    if (plan.pick && !el.closest('#picker') && !el.closest('#map')) closePicker();
    if (el.closest('[data-opendraw]')) return enterDraw();
    if ((n = el.closest('[data-pick]'))) return selectEntry(n.dataset.pick);
    if ((n = el.closest('[data-side]'))) return selectSide(n.dataset.side);
    if ((n = el.closest('[data-play]'))) return setPlay(n.dataset.play);
    if ((n = el.closest('[data-session]'))) return selectSession(n.dataset.session);
    if (el.closest('[data-clear]')) { if (state.session) selectSession(state.session); return; }
    if ((n = el.closest('[data-view]'))) { state.view = n.dataset.view; last = view(); paintMap(last); keepFocus(() => put($('layers'), last.layers)); return; }
    if ((n = el.closest('[data-layer]'))) { if (n.dataset.layer === 'pred') stop(); state.layers[n.dataset.layer] = !state.layers[n.dataset.layer]; refresh(); return; }
    if ((n = el.closest('#speed [data-speed]'))) { state.speed = +n.dataset.speed; document.querySelectorAll('#speed button').forEach((b) => b.setAttribute('aria-pressed', String(b === n))); return; }
    if ((n = el.closest('#map [data-step], #steps tr[data-step]'))) { const i = +n.dataset.step; if (i >= 0) selectStep(state.step === i ? null : i, true); return; }
  });
  // Remember which disclosures are open across repaints; only a real change gets the entrance.
  document.addEventListener('toggle', (e) => {
    const d = e.target, key = d.dataset ? d.dataset.keep : null;
    if (!key || !!state.open[key] === d.open) return;
    state.open[key] = d.open;
    if (d.open) { d.classList.add('enter'); d.addEventListener('animationend', () => d.classList.remove('enter'), { once: true }); }
  }, true);
  svg.addEventListener('mouseover', (e) => { const n = e.target.closest('[data-step]'); const i = n ? +n.dataset.step : null; if (i !== state.hover) { state.hover = i; refreshHover(); } });
  svg.addEventListener('mouseleave', () => { if (state.hover != null) { state.hover = null; refreshHover(); } });
  $('steps').addEventListener('mouseover', (e) => { const n = e.target.closest('tr[data-step]'); const i = n && +n.dataset.step >= 0 ? +n.dataset.step : null; if (i !== state.hover) { state.hover = i; refreshHover(); } });
  $('steps').addEventListener('mouseleave', () => { if (state.hover != null) { state.hover = null; refreshHover(); } });
  $('btn-prev').addEventListener('click', () => stepBy(-1));
  $('btn-next').addEventListener('click', () => stepBy(1));
  $('btn-play').addEventListener('click', togglePlay);
  $('scrub').addEventListener('input', (e) => {
    const s = last.sel.scrub;
    if (!s) return;
    if (state.playing) stop();
    state.t = (+e.target.value / 1000) * s.duration;
    refreshPlay();
  });
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target, tag = t && t.tagName;
    if (e.key === 'Escape') {
      const m = document.querySelector('details.menu[open]');
      if (m) { m.open = false; m.querySelector('summary').focus(); } else if (plan.stroke) cancelStroke(); else if (plan.pick) closePicker(); else if (plan.on && (tag === 'INPUT' || tag === 'TEXTAREA')) t.blur(); // never clears the drawing
      return;
    }
    if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'range')) return; // typing in a field is not playback
    if (plan.on) return; // the transport is hidden while drawing, so its keys do nothing
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && tag === 'INPUT' && t.type === 'range') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stepBy(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(-1); }
    else if (e.key === ' ' || e.code === 'Space') {
      if (tag === 'BUTTON' || tag === 'SUMMARY' || tag === 'INPUT') return; // a focused control keeps its own Space
      e.preventDefault(); togglePlay();
    }
  });

  /* ----- sizing: keep UI marks a fixed pixel size while the field scales ----- */
  function measure() {
    const w = svg.getBoundingClientRect().width;
    if (w && Math.abs(w - W) > 1) { W = w; closePicker(); last = view(); paintMap(last); } // a picker placed for the old size would be in the wrong spot
  }
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(measure).observe(svg); else window.addEventListener('resize', measure);
  // Side by side the list is always showing; stacked on a narrow screen it starts folded so the map comes first.
  const mq = window.matchMedia ? window.matchMedia('(max-width: 719px)') : null;
  const lists = $('lists');
  function syncLists() { if (mq && !mq.matches) lists.open = true; else if (mq && mq.matches && !lists.dataset.touched) lists.open = false; }
  $('listsum').addEventListener('click', () => { lists.dataset.touched = '1'; });
  if (mq) { (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(syncLists); }
  W = svg.getBoundingClientRect().width || W;
  syncLists();
  state.play = defaultPlay();
  refresh();

  /* ----- embedded in an iframe: tell the host how tall the page is ----- */
  if (EMBED && window.parent !== window) {
    let sent = -1;
    const report = () => {
      const h = Math.ceil(app.getBoundingClientRect().height);
      if (h !== sent) { sent = h; window.parent.postMessage({ type: 'scourge-map', height: h }, /^https?:/.test(location.origin) ? location.origin : '*'); }
    };
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(report).observe(app); else window.addEventListener('resize', report);
    report();
  }
})();
</script>
</body>
</html>
